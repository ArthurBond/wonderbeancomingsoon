<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | @wonderbeandraws</title>
  <meta name="description" content="Coming Soon - @wonderbeandraws on Instagram">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-content: center;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #faf9f6;
      color: #1a1a1a;
      padding: 1.5rem;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #f5f5f5;
      }
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .instagram-link {
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      color: #d62976;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s ease, transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .instagram-link:hover,
    .instagram-link:focus-visible {
      opacity: 0.8;
      text-decoration: underline;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming Soon</h1>
    <a 
      class="instagram-link" 
      href="https://www.instagram.com/wonderbeandraws/" 
      target="_blank" 
      rel="noopener noreferrer"
    >
      @wonderbeandraws
    </a>
  </main>
</body>
</html>
